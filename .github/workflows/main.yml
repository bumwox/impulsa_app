name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generar carpetas de Android
        run: flutter create --platforms=android --project-name impulsa --org cl.udp .
      - name: Permiso de internet (tipografía Poppins)
        run: sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml
      - name: Nombre visible de la app
        run: sed -i 's|android:label="impulsa"|android:label="Impulsa"|' android/app/src/main/AndroidManifest.xml
      - name: Compilar APK
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: impulsa-apk
          path: build/app/outputs/flutter-apk/app-release.apk
